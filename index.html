<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptoVision 智慧隱形眼鏡驗配系統</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        /* 沿用明亮現代醫療風格 */
        :root {
            --bg-main: #f1f5f9; --bg-panel: #ffffff; --border-color: #cbd5e1;
            --primary-blue: #0284c7; --primary-green: #059669; --text-main: #1e293b;
            --text-muted: #64748b; --od-color: #ea580c; --os-color: #7c3aed;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 20px; }
        
        header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: 700; color: var(--primary-blue); }
        .tab-btn { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 10px 24px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .tab-btn.active { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        
        .customer-bar { background: var(--bg-panel); border-left: 5px solid var(--primary-green); padding: 15px; border-radius: 8px; display: flex; gap: 20px; margin-bottom: 20px; }
        .customer-bar input { border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; }
        
        .eyes-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .eye-panel { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .eye-panel.od { border-top: 5px solid var(--od-color); }
        .eye-panel.os { border-top: 5px solid var(--os-color); }
        
        .grid-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .input-group label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; border: 1px solid var(--border-color); padding: 8px; border-radius: 4px; }
        
        .action-bar { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px; }
        .btn { border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background: #64748b; }
        .btn-success { background: var(--primary-green); }
        .btn-primary { background: var(--primary-blue); }
        
        /* 系統提示訊息區塊 */
        #sys-message {
            margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-weight: bold; text-align: center; grid-column: 1 / -1;
        }
        .msg-success { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
        .msg-error { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-notes-medical"></i> OptoVision System</div>
        <div class="main-tabs">
            <button class="tab-btn active" onclick="switchTab('RGP_Sphere', this)">硬式對稱</button>
            <button class="tab-btn" onclick="switchTab('RGP_Toric', this)">硬式環曲 (Toric)</button>
            <button class="tab-btn" onclick="switchTab('Soft', this)">軟式驗配</button>
        </div>
    </header>

    <div class="customer-bar">
        <div><label>姓名：</label><input type="text" id="cust_name" placeholder="王大明"></div>
        <div><label>手機：</label><input type="tel" id="cust_phone" placeholder="0912345678"></div>
        <div><label>生日：</label><input type="date" id="cust_birthday"></div>
    </div>

    <div class="eyes-container">
        <div class="eye-panel od">
            <h3 style="color: var(--od-color); margin-bottom: 15px;">右眼 (OD) AUTO</h3>
            <div class="grid-inputs">
                <div class="input-group"><label>SPH</label><input type="number" step="0.25"></div>
                <div class="input-group"><label>CYL</label><input type="number" step="0.25"></div>
                <div class="input-group"><label>AXIS</label><input type="number"></div>
            </div>
            <div class="grid-inputs">
                <div class="input-group"><label>K1 (平坦)</label><input type="number" step="0.01"></div>
                <div class="input-group"><label>K2 (陡峭)</label><input type="number" step="0.01"></div>
                <div class="input-group"><label>戴鏡驗光 OR</label><input type="number" step="0.25"></div>
            </div>
        </div>

        <div class="eye-panel os">
            <h3 style="color: var(--os-color); margin-bottom: 15px;">左眼 (OS) AUTO</h3>
            <div class="grid-inputs">
                <div class="input-group"><label>SPH</label><input type="number" step="0.25"></div>
                <div class="input-group"><label>CYL</label><input type="number" step="0.25"></div>
                <div class="input-group"><label>AXIS</label><input type="number"></div>
            </div>
            <div class="grid-inputs">
                <div class="input-group"><label>K1 (平坦)</label><input type="number" step="0.01"></div>
                <div class="input-group"><label>K2 (陡峭)</label><input type="number" step="0.01"></div>
                <div class="input-group"><label>戴鏡驗光 OR</label><input type="number" step="0.25"></div>
            </div>
        </div>

        <div id="sys-message"></div>

        <div class="action-bar">
            <button class="btn btn-secondary" onclick="testAction(this, '試戴片庫功能即將上線')"><i class="fa-solid fa-database"></i> 管理試戴片庫</button>
            <button class="btn btn-primary" onclick="testAction(this, 'PDF 輸出引擎準備中')"><i class="fa-solid fa-file-pdf"></i> 輸出 PDF</button>
            <button class="btn btn-success" id="saveBtn" onclick="saveToSupabase()"><i class="fa-solid fa-cloud-arrow-up"></i> 儲存至 Supabase</button>
        </div>
    </div>

    <script>
        // 1. 初始化 Supabase
        const supabaseUrl = 'https://pyyszbkcemqvmrecokwt.supabase.co';
        const supabaseKey = 'sb_publishable_kVgIy7INN2ohTMbsdh7PZg_TWG4LH7p';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 2. 切換 TAB (實體回饋)
        function switchTab(type, element) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            showMessage(`已切換至【${element.innerText}】模式`, 'success');
        }

        // 3. 通用按鈕測試 (確保按鍵有反應)
        function testAction(btn, msg) {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 處理中...';
            btn.disabled = true;
            
            setTimeout(() => {
                showMessage(msg, 'success');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 800);
        }

        // 4. 顯示系統訊息
        function showMessage(text, type) {
            const msgBox = document.getElementById('sys-message');
            msgBox.textContent = text;
            msgBox.className = type === 'success' ? 'msg-success' : 'msg-error';
            msgBox.style.display = 'block';
            setTimeout(() => msgBox.style.display = 'none', 3500);
        }

        // 5. 核心：寫入 Supabase (搭配 RLS Policy)
        async function saveToSupabase() {
            const name = document.getElementById('cust_name').value.trim();
            const phone = document.getElementById('cust_phone').value.trim();
            const birthday = document.getElementById('cust_birthday').value;
            const btn = document.getElementById('saveBtn');

            if(!name || !phone || !birthday) {
                showMessage('⚠️ 儲存失敗：請先填寫上方姓名、手機與生日欄位！', 'error');
                return;
            }

            // 按鈕進入讀取狀態
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 寫入資料庫中...';
            btn.disabled = true;

            try {
                const { data, error } = await supabase
                    .from('customers')
                    .insert([{ name: name, phone: phone, birthday: birthday }])
                    .select();

                if (error) throw error;
                
                showMessage(`✅ 寫入成功！客戶 ${name} 資料已儲存，且受 RLS 保護。`, 'success');
                
            } catch (err) {
                showMessage(`❌ 寫入失敗：${err.message} (請確認步驟一的 RLS Policy 是否已執行)`, 'error');
            } finally {
                // 恢復按鈕狀態
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
